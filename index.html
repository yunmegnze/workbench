function submitQuickAdd(form) {
  const input = form.querySelector('#quick-add-input');
  const title = (input?.value || '').trim();
  if (!title) {
    input?.focus();
    return;
  }
  const now = new Date();
  const due = new Date(now);
  due.setHours(18, 0, 0, 0);
  if (due <= now) due.setDate(due.getDate() + 1);
  S.tasks.push({
    id: uid('t'),
    title,
    projectId: '',
    priority: 'medium',
    status: 'pending',
    dueAt: due.toISOString(),
    createdAt: now.toISOString(),
    completedAt: null,
    estMinutes: 30
  });
  persist();
  UI.focusAfterRender = '#quick-add-input';
  renderAll();
  toast('任务已加入待办');
}

function submitEventForm(form) {
  const data = new FormData(form);
  const id = String(data.get('id') || '');
  const title = String(data.get('title') || '').trim();
  const date = String(data.get('date') || '');
  const start = String(data.get('start') || '');
  const end = String(data.get('end') || '');
  const type = String(data.get('type') || 'meeting');
  const projectId = String(data.get('projectId') || '');
  const location = String(data.get('location') || '').trim();
  if (!title) { toast('请填写日程标题', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !/^\d{2}:\d{2}$/.test(start) || !/^\d{2}:\d{2}$/.test(end)) {
    toast('请填写完整的日期和时间', 'error');
    return;
  }
  const startMinutes = minutesOf(start);
  const endMinutes = minutesOf(end);
  if (startMinutes < 480 || endMinutes > 1200) {
    toast('日程时间需在 08:00 – 20:00 之间', 'error');
    return;
  }
  if (endMinutes <= startMinutes) {
    toast('结束时间需要晚于开始时间', 'error');
    return;
  }
  const existing = id ? S.events.find(event => event.id === id) : null;
  const payload = {
    title,
    date,
    start,
    end,
    type: EVENT_TYPES[type] ? type : 'meeting',
    projectId: S.projects.some(project => project.id === projectId) ? projectId : '',
    location
  };
  if (existing) Object.assign(existing, payload);
  else S.events.push({ id: uid('e'), ...payload });
  UI.scheduleDate = date;
  closeModal();
  persist();
  renderAll();
  toast(existing ? '日程已更新' : '日程已创建');
}

function submitTaskForm(form) {
  const data = new FormData(form);
  const task = taskById(String(data.get('id') || ''));
  if (!task) { closeModal(); return; }
  const title = String(data.get('title') || '').trim();
  const date = String(data.get('date') || '');
  const time = String(data.get('time') || '18:00');
  const projectId = String(data.get('projectId') || '');
  const priority = String(data.get('priority') || 'medium');
  if (!title) { toast('请填写任务标题', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选择截止日期', 'error'); return; }
  const due = new Date(`${date}T${time || '18:00'}:00`);
  if (Number.isNaN(due.getTime())) { toast('截止时间格式不正确', 'error'); return; }
  task.title = title;
  task.projectId = S.projects.some(project => project.id === projectId) ? projectId : '';
  task.priority = PRIORITIES[priority] ? priority : 'medium';
  task.dueAt = due.toISOString();
  closeModal();
  persist();
  renderAll();
  toast('任务已更新');
}

function submitProjectForm(form) {
  const data = new FormData(form);
  const id = String(data.get('id') || '');
  const existing = id ? projectById(id) : null;
  const name = String(data.get('name') || '').trim();
  if (!name) { toast('请填写项目名称', 'error'); return; }
  const members = [...new Set(String(data.get('members') || '')
    .split(/[,，、;；]/)
    .map(item => item.trim())
    .filter(Boolean))];
  const status = String(data.get('status') || 'ongoing');
  const priority = String(data.get('priority') || 'medium');
  const color = String(data.get('color') || 'blue');
  const startDate = String(data.get('startDate') || '').trim() || (existing ? existing.startDate : todayISO());
  const endDate = String(data.get('endDate') || '').trim() || (existing ? existing.endDate : dateISO(addDays(new Date(), 30)));
  if (startDate > endDate) {
    toast('结束日期不能早于开始日期', 'error');
    return;
  }
  const payload = {
    name,
    description: String(data.get('description') || '').trim(),
    status: BASE_STATUS_ORDER.includes(status) ? status : 'ongoing',
    priority: PRIORITIES[priority] ? priority : 'medium',
    color: PROJECT_COLORS[color] ? color : 'blue',
    startDate,
    endDate,
    members: members.length ? members : [USER_NAME]
  };
  UI.activeTab = 'projects';
  if (existing) {
    Object.assign(existing, payload);
    if (projectIsComplete(existing)) UI.completedGroupOpen = true;
    UI.expanded.add(existing.id);
    closeModal();
    persist();
    renderAll();
    toast('项目信息已更新');
    setTimeout(() => {
      const row = document.querySelector(`.prow[data-id="${existing.id}"]`);
      if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 80);
    return;
  }
  const project = {
    id: uid('p'),
    progress: 0,
    dependsOn: '',
    notes: '',
    subtasks: [],
    ...payload
  };
  S.projects.push(project);
  UI.expanded.add(project.id);
  closeModal();
  persist();
  renderAll(true);
  toast('项目已创建，可以开始拆解子任务');
  setTimeout(() => {
    const row = document.querySelector(`.prow[data-id="${project.id}"]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 80);
}

function onSubmit(event) {
  const form = event.target;
  if (form.id === 'quick-add-form') {
    event.preventDefault();
    submitQuickAdd(form);
    return;
  }
  const kind = form.dataset.form;
  if (!kind) return;
  event.preventDefault();
  if (kind === 'event') submitEventForm(form);
  else if (kind === 'task') submitTaskForm(form);
  else if (kind === 'project') submitProjectForm(form);
}

/* =========================================================
   二十一、图表交互与时间线
   ========================================================= */
function initChart() {
  const wrap = $('#chart-wrap');
  const svg = $('#trend-svg');
  const tip = $('#chart-tip');
  const focus = $('#chart-focus');
  if (!wrap || !svg || !tip || !focus) return;
  const stats = lastNDaysStats(30);
  const values = stats.days.map(day => logFor(day.date)?.total || 0);
  const W = 920, H = 252, PL = 34, PR = 14, PT = 18, PB = 30;
  const innerW = W - PL - PR;
  const innerH = H - PT - PB;
  const yMax = Math.max(4, Math.ceil(Math.max(1, ...values) / 2) * 2);
  const stepX = values.length > 1 ? innerW / (values.length - 1) : 0;
  const x = i => PL + i * stepX;
  const y = v => PT + (1 - v / yMax) * innerH;
  const line = focus.querySelector('line');
  const dot = focus.querySelector('circle');
  const hide = () => {
    focus.style.opacity = '0';
    tip.style.opacity = '0';
  };
  const show = index => {
    if (!Number.isInteger(index) || index < 0 || index >= values.length) return;
    const px = x(index);
    const py = y(values[index]);
    focus.style.opacity = '1';
    line.setAttribute('x1', px);
    line.setAttribute('x2', px);
    dot.setAttribute('cx', px);
    dot.setAttribute('cy', py);
    const svgRect = svg.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    tip.style.left = `${svgRect.left - wrapRect.left + (px / W) * svgRect.width}px`;
    tip.style.top = `${svgRect.top - wrapRect.top + (py / H) * svgRect.height}px`;
    tip.style.opacity = '1';
    const dateObj = stats.days[index].dateObj;
    tip.innerHTML = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日 · ${weekdayCN[dateObj.getDay()]}<strong>${values[index]} <span>项完成</span></strong>`;
  };
  $$('.chart-hit', wrap).forEach(hit => {
    const index = Number(hit.dataset.i);
    hit.addEventListener('mouseenter', () => show(index));
    hit.addEventListener('mousemove', () => show(index));
  });
  wrap.addEventListener('mouseleave', hide);
}

function updateNowLine() {
  const line = $('.now-line');
  if (!line) return;
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  if (UI.activeTab !== 'schedule' || UI.scheduleView !== 'day' || UI.scheduleDate !== todayISO() || minutes < 480 || minutes > 1200) {
    line.remove();
    return;
  }
  line.style.top = `${((minutes - 480) / 60 * 64).toFixed(1)}px`;
  const chip = line.querySelector('.now-chip');
  if (chip) chip.textContent = hm(now);
}

/* =========================================================
   二十二、拖拽排期
   ========================================================= */
let dragPayload = null;
let suppressClicksUntil = 0;

function slotFromPointer(event) {
  const slots = $('#day-slots');
  if (!slots) return null;
  const rect = slots.getBoundingClientRect();
  const scrollBox = $('#day-scroll')?.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right) return null;
  if (event.clientY < rect.top || event.clientY > rect.bottom) return null;
  if (scrollBox && (event.clientY < scrollBox.top || event.clientY > scrollBox.bottom)) return null;
  const offsetY = clamp(event.clientY - rect.top, 0, rect.height - 1);
  const hour = Math.min(19, 8 + Math.floor(offsetY / 64));
  const minute = Math.floor((offsetY % 64) / 16) * 15;
  const slot = slots.querySelector(`.day-slot[data-hour="${hour}"]`);
  if (!slot) return null;
  return { slot, date: slot.dataset.date, hour, minute };
}

function cleanupDrag() {
  $$('.dragging').forEach(element => element.classList.remove('dragging'));
  $$('.day-slot.drag-over').forEach(element => element.classList.remove('drag-over'));
  dragPayload = null;
}

function onDragStart(event) {
  const taskElement = event.target.closest('.drag-task');
  if (taskElement) {
    dragPayload = { type: 'task', id: taskElement.dataset.dragTask };
    event.dataTransfer.effectAllowed = 'copy';
    try { event.dataTransfer.setData('text/plain', `task:${dragPayload.id}`); } catch (error) { /* noop */ }
    setTimeout(() => taskElement.classList.add('dragging'), 0);
    return;
  }
  const eventElement = event.target.closest('.cal-event[data-drag-event]');
  if (eventElement) {
    dragPayload = { type: 'event', id: eventElement.dataset.dragEvent };
    event.dataTransfer.effectAllowed = 'move';
    try { event.dataTransfer.setData('text/plain', `event:${dragPayload.id}`); } catch (error) { /* noop */ }
    setTimeout(() => eventElement.classList.add('dragging'), 0);
  }
}

function onDragOver(event) {
  if (!dragPayload) return;
  const position = slotFromPointer(event);
  if (!position) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = dragPayload.type === 'task' ? 'copy' : 'move';
  $$('.day-slot.drag-over').forEach(slot => { if (slot !== position.slot) slot.classList.remove('drag-over'); });
  position.slot.classList.add('drag-over');
}

function onDragLeave(event) {
  const related = event.relatedTarget;
  if (related && related.closest && related.closest('#day-slots')) return;
  $$('.day-slot.drag-over').forEach(slot => slot.classList.remove('drag-over'));
}

function onDrop(event) {
  if (!dragPayload) return;
  const position = slotFromPointer(event);
  if (!position) return;
  event.preventDefault();
  const payload = dragPayload;
  const baseStart = position.hour * 60 + position.minute;
  let changed = false;

  if (payload.type === 'task') {
    const task = taskById(payload.id);
    if (task) {
      const duration = clamp(Number(task.estMinutes) || 45, 30, 120);
      const startMinutes = clamp(baseStart, 480, 1200 - duration);
      const endMinutes = startMinutes + duration;
      const existing = scheduledEventForTask(task.id);
      if (existing) {
        Object.assign(existing, {
          date: position.date,
          start: fromMinutes(startMinutes),
          end: fromMinutes(endMinutes),
          type: 'task',
          projectId: task.projectId
        });
        toast('排期时间已更新');
      } else {
        S.events.push({
          id: uid('e'),
          title: task.title,
          date: position.date,
          start: fromMinutes(startMinutes),
          end: fromMinutes(endMinutes),
          type: 'task',
          projectId: task.projectId,
          location: '',
          taskId: task.id
        });
        toast('已加入日历，开始专注吧');
      }
      changed = true;
    }
  } else {
    const eventItem = S.events.find(item => item.id === payload.id);
    if (eventItem) {
      const duration = clamp(minutesOf(eventItem.end) - minutesOf(eventItem.start), 15, 120);
      const startMinutes = clamp(baseStart, 480, 1200 - duration);
      eventItem.date = position.date;
      eventItem.start = fromMinutes(startMinutes);
      eventItem.end = fromMinutes(startMinutes + duration);
      changed = true;
      toast('日程时间已调整');
    }
  }

  suppressClicksUntil = Date.now() + 420;
  cleanupDrag();
  if (changed) {
    persist();
    renderAll();
  }
}

function onDragEnd() {
  cleanupDrag();
}

/* =========================================================
   二十三、全局事件绑定
   ========================================================= */
function onClick(event) {
  const target = event.target;
  if (!target || !target.closest) return;

  const themeTile = target.closest('[data-theme-choice]');
  if (themeTile) {
    setThemeChoice(themeTile.dataset.themeChoice);
    return;
  }

  const scheduleViewButton = target.closest('[data-schedule-view]');
  if (scheduleViewButton) {
    const view = scheduleViewButton.dataset.scheduleView;
    if (['day', 'week', 'month'].includes(view)) {
      UI.scheduleView = view;
      UI.scheduleDate = UI.scheduleDate || todayISO();
      renderAll(true);
    }
    return;
  }

  const navButton = target.closest('[data-nav]');
  if (navButton) {
    navigate(navButton.dataset.nav);
    return;
  }

  const actionElement = target.closest('[data-action]');
  if (actionElement) {
    handleAction(actionElement.dataset.action, actionElement);
    return;
  }

  if (UI.modal && target.matches('[data-modal-backdrop]')) {
    closeModal();
    return;
  }

  const slot = target.closest('.day-slot');
  if (slot) {
    if (Date.now() < suppressClicksUntil) return;
    const rect = slot.getBoundingClientRect();
    const minute = Math.floor(clamp(event.clientY - rect.top, 0, 63) / 16) * 15;
    const hour = Number(slot.dataset.hour);
    const startMinutes = hour * 60 + minute;
    closeBell();
    openModal('event', {
      date: slot.dataset.date,
      start: fromMinutes(startMinutes),
      end: fromMinutes(Math.min(1200, startMinutes + 60)),
      type: 'meeting',
      projectId: '',
      location: ''
    });
    return;
  }

  if (UI.menu && !target.closest('.menu') && !target.closest('[data-action="task-menu"]') && !target.closest('[data-action="project-menu"]')) {
    closeMenu();
  }
  if (UI.bellOpen && !target.closest('.bell-wrap')) {
    UI.bellOpen = false;
    renderTopbar();
  }
}

function onFocusOut(event) {
  const input = event.target.closest ? event.target.closest('.sub-input') : null;
  if (!input || !UI.addingSubtask) return;
  const pending = UI.addingSubtask;
  /* 延后到本轮点击处理完再判断，避免切换输入框或回车新增时误取消 */
  setTimeout(() => {
    if (UI.addingSubtask !== pending) return;
    const active = document.activeElement;
    if (active && active.closest && active.closest('.sub-input')) return;
    UI.addingSubtask = null;
    if (document.body.contains(input) && UI.activeTab === 'projects') renderAll();
  }, 0);
}

function onKeyDown(event) {
  if (event.isComposing || event.keyCode === 229) return;
  if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 'b') {
    event.preventDefault();
    toggleSidebar();
    return;
  }

  const subInput = event.target.closest ? event.target.closest('.sub-input') : null;
  if (subInput) {
    if (event.key === 'Enter') {
      event.preventDefault();
      addSubtaskFromInput(subInput);
    } else if (event.key === 'Escape') {
      event.preventDefault();
      UI.addingSubtask = null;
      renderAll();
    }
    return;
  }

  if (event.key === 'Escape') {
    if (UI.modal) { closeModal(); return; }
    if (UI.menu) { closeMenu(); return; }
    if (UI.bellOpen) { UI.bellOpen = false; renderTopbar(); return; }
    if (UI.addingSubtask) { UI.addingSubtask = null; renderAll(); return; }
    return;
  }

  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches && event.target.matches('.prow')) {
    event.preventDefault();
    event.target.click();
    return;
  }

  if ((event.key === 'n' || event.key === 'N') && !event.ctrlKey && !event.metaKey && !event.altKey && !event.repeat) {
    const tag = (event.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || event.target.isContentEditable;
    if (typing || UI.modal || UI.activeTab !== 'overview') return;
    const input = $('#quick-add-input');
    if (input) {
      event.preventDefault();
      input.focus();
    }
  }
}

function onInput(event) {
  const editor = event.target.closest ? event.target.closest('.notes-editor') : null;
  if (!editor) return;
  const project = projectById(editor.dataset.notesProject);
  if (!project) return;
  project.notes = sanitizeNotes(editor.innerHTML);
  persist();
}

function onChange(event) {
  const fileInput = event.target.id === 'import-json-input' ? event.target : null;
  if (fileInput) {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    prepareImportJSON(file);
    return;
  }
  const select = event.target.closest ? event.target.closest('.dep-select') : null;
  if (!select) return;
  const project = projectById(select.dataset.depProject);
  if (!project) return;
  project.dependsOn = select.value;
  persist();
  renderAll();
}

function onMouseDown(event) {
  if (event.target.closest && event.target.closest('[data-action="note-format"]')) {
    event.preventDefault();
  }
}

function onBeforeUnload() {
  if (!S) return;
  clearTimeout(saveTimer);
  S.meta.savedAt = new Date().toISOString();
  Store.save(S);
}

/* =========================================================
   二十四、状态修复与启动
   ========================================================= */
function normalizeState(raw) {
  if (!raw || !Array.isArray(raw.tasks) || !Array.isArray(raw.projects)) return null;
  const nowISO = new Date().toISOString();
  const normalizeNode = node => ({
    id: node && node.id ? node.id : uid('s'),
    title: String(node && node.title || ''),
    done: !!(node && node.done),
    children: Array.isArray(node && node.children) ? node.children.map(normalizeNode) : []
  });
  const state = {
    version: 1,
    tasks: raw.tasks
      .filter(task => task && task.id && task.title)
      .map(task => ({
        ...task,
        projectId: task.projectId || '',
        priority: PRIORITIES[task.priority] ? task.priority : 'medium',
        status: task.status === 'completed' ? 'completed' : 'pending',
        dueAt: task.dueAt || nowISO,
        createdAt: task.createdAt || nowISO,
        completedAt: task.status === 'completed' ? (task.completedAt || task.dueAt || nowISO) : null,
        estMinutes: Number(task.estMinutes) || 30
      })),
    projects: raw.projects
      .filter(project => project && project.id && project.name)
      .map(project => ({
        ...project,
        description: project.description || '',
        status: BASE_STATUS_ORDER.includes(project.status) ? project.status : 'ongoing',
        priority: PRIORITIES[project.priority] ? project.priority : 'medium',
        progress: clamp(Number(project.progress) || 0, 0, 100),
        color: PROJECT_COLORS[project.color] ? project.color : 'blue',
        startDate: project.startDate || todayISO(),
        endDate: project.endDate || dateISO(addDays(new Date(), 30)),
        members: Array.isArray(project.members) && project.members.length ? project.members : [USER_NAME],
        dependsOn: project.dependsOn || '',
        notes: typeof project.notes === 'string' ? sanitizeNotes(project.notes) : '',
        subtasks: Array.isArray(project.subtasks) ? project.subtasks.map(normalizeNode) : []
      })),
    events: (Array.isArray(raw.events) ? raw.events : [])
      .filter(event => event && event.id && event.title && /^\d{4}-\d{2}-\d{2}$/.test(event.date || ''))
      .map(event => ({
        ...event,
        start: /^\d{2}:\d{2}$/.test(event.start || '') ? event.start : '10:00',
        end: /^\d{2}:\d{2}$/.test(event.end || '') ? event.end : '11:00',
        type: EVENT_TYPES[event.type] ? event.type : 'meeting',
        projectId: event.projectId || '',
        location: event.location || ''
      })),
    logs: (Array.isArray(raw.logs) ? raw.logs : [])
      .filter(log => log && /^\d{4}-\d{2}-\d{2}$/.test(log.date || ''))
      .map(log => {
        const counts = {};
        Object.entries(log.counts || {}).forEach(([key, value]) => {
          const number = Number(value);
          if (number > 0) counts[key] = number;
        });
        return {
          date: log.date,
          counts,
          total: Number(log.total) || 0,
          onTime: Number(log.onTime) || 0,
          focusMin: Number(log.focusMin) || 0
        };
      })
      .sort((a, b) => a.date.localeCompare(b.date)),
    settings: {
      theme: ['light', 'dark', 'system'].includes(raw.settings?.theme) ? raw.settings.theme : 'system',
      notifications: raw.settings?.notifications !== false,
      collapsed: !!raw.settings?.collapsed
    },
    meta: {
      createdAt: raw.meta?.createdAt || nowISO,
      savedAt: raw.meta?.savedAt || nowISO,
      cleared: !!raw.meta?.cleared
    }
  };
  state.projects.forEach(project => {
    refreshParentStates(project.subtasks);
    updateProjectProgress(project);
  });
  return state;
}

async function boot() {
  let normalized = null;
  try {
    const raw = await Store.load();
    normalized = normalizeState(raw);
  } catch (error) {
    normalized = null;
  }
  S = normalized || createEmptyState('system');
  S.projects.forEach(project => {
    refreshParentStates(project.subtasks);
    updateProjectProgress(project);
  });
  applyTheme();
  renderAll(true);

  const bootScreen = $('#boot-screen');
  if (bootScreen) {
    bootScreen.classList.add('hide');
    setTimeout(() => bootScreen.remove(), 380);
  }

  if (!initCloudAuth()) {
    showAuthScreen('云同步组件加载失败，请检查网络后刷新页面。', 'error');
    return;
  }

  try {
    const { data, error } = await Cloud.client.auth.getSession();
    if (error) throw error;
    if (data.session?.user) {
      await enterApp(data.session.user);
    } else {
      showAuthScreen();
    }
  } catch (error) {
    showAuthScreen('读取登录状态失败：' + cloudErrorText(error), 'error');
  }
}

document.addEventListener('click', onClick);
document.addEventListener('submit', onSubmit);
document.addEventListener('keydown', onKeyDown);
document.addEventListener('focusout', onFocusOut);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.addEventListener('mousedown', onMouseDown);
document.addEventListener('dragstart', onDragStart);
document.addEventListener('dragover', onDragOver);
document.addEventListener('dragleave', onDragLeave);
document.addEventListener('drop', onDrop);
document.addEventListener('dragend', onDragEnd);
window.addEventListener('beforeunload', onBeforeUnload);

if (window.matchMedia) {
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const onThemeChange = () => {
    if (S && S.settings.theme === 'system') applyTheme();
  };
  if (media.addEventListener) media.addEventListener('change', onThemeChange);
  else if (media.addListener) media.addListener(onThemeChange);
}

setInterval(updateNowLine, 60000);

window.addEventListener('online', () => {
  updateSyncUI();
  if (!Cloud.user || !Cloud.ready) return;
  if (Cloud.dirty) void cloudSync();
  else void pullCloud();
});
window.addEventListener('offline', updateSyncUI);
window.addEventListener('focus', () => {
  if (!Cloud.user || !Cloud.ready || !navigator.onLine) return;
  if (Cloud.dirty) void cloudSync();
  else void pullCloud();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!Cloud.user || !Cloud.ready || !navigator.onLine) return;
  if (Cloud.dirty) void cloudSync();
  else void pullCloud();
});
setInterval(() => {
  if (document.hidden || !Cloud.user || !Cloud.ready || !navigator.onLine) return;
  if (Cloud.dirty) void cloudSync();
  else void pullCloud();
}, 45000);

boot();
})();
</script>
