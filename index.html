/* =========================================================
   五之二、Supabase Auth 与多端同步
   ========================================================= */
const AUTH = {
  mode: 'login',
  busy: false,
  bound: false,
  entering: false
};
const Cloud = {
  client: null,
  user: null,
  version: 0,
  ready: false,
  syncing: false,
  pending: false,
  dirty: false,
  error: '',
  lastSyncedAt: null,
  timer: null,
  dirtyKey: ''
};

function initSupabase() {
  if (Cloud.client) return Cloud.client;
  if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
  Cloud.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });
  return Cloud.client;
}

function authRedirectUrl() {
  try {
    const url = new URL(location.href);
    url.hash = '';
    return url.href;
  } catch (error) {
    return location.href.split('#')[0];
  }
}

function guestClaimed() {
  try { return localStorage.getItem(GUEST_CLAIM_KEY) === '1'; }
  catch (error) { return false; }
}
function claimGuest() {
  try { localStorage.setItem(GUEST_CLAIM_KEY, '1'); }
  catch (error) { /* 忽略隐私模式限制 */ }
}

function isCloudDirty() {
  if (!Cloud.dirtyKey) return false;
  try { return localStorage.getItem(Cloud.dirtyKey) === '1'; }
  catch (error) { return false; }
}
function markCloudDirty() {
  if (!Cloud.user) return;
  Cloud.dirty = true;
  try { localStorage.setItem(Cloud.dirtyKey, '1'); }
  catch (error) { /* 忽略 */ }
  updateSyncUI();
}
function clearCloudDirty() {
  Cloud.dirty = false;
  if (!Cloud.dirtyKey) return;
  try { localStorage.removeItem(Cloud.dirtyKey); }
  catch (error) { /* 忽略 */ }
}

function cloudErrorText(error) {
  return String(error?.message || error?.details || error?.hint || error || '未知错误');
}

function syncLabel() {
  if (!navigator.onLine) return '离线';
  if (Cloud.syncing) return '同步中';
  if (Cloud.error) return '同步失败';
  if (Cloud.dirty) return '待同步';
  return '已同步';
}
function syncClass() {
  if (!navigator.onLine) return 'offline';
  if (Cloud.syncing) return 'syncing';
  if (Cloud.error) return 'error';
  if (Cloud.dirty) return 'pending';
  return 'ok';
}
function syncTimeText() {
  if (!Cloud.lastSyncedAt) return '';
  try {
    return Cloud.lastSyncedAt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  } catch (error) { return ''; }
}
function syncTitle() {
  if (Cloud.error) return `同步失败：${Cloud.error}`;
  const time = syncTimeText();
  return `${syncLabel()}${time ? ' · ' + time : ''}，点击立即同步`;
}
function syncStatusText() {
  if (!navigator.onLine) return '当前离线，修改会保存在本机，联网后自动同步。';
  if (Cloud.syncing) return '正在同步到云端…';
  if (Cloud.error) return `同步失败：${Cloud.error}。修改已保存在本机，可稍后重试。`;
  if (Cloud.dirty) return '有本地修改等待同步…';
  return `已同步${syncTimeText() ? ' · ' + syncTimeText() : ''}。数据已保存到云端。`;
}
function syncChipHTML() {
  if (!Cloud.user) return '';
  return `<button id="sync-chip" class="sync-chip ${syncClass()}" data-action="sync-now" title="${escapeHTML(syncTitle())}">
    ${icon('cloud')}<span class="sync-label">${escapeHTML(syncLabel())}</span><i class="sync-dot"></i>
  </button>`;
}
function updateSyncUI() {
  const chip = $('#sync-chip');
  if (chip) {
    chip.className = `sync-chip ${syncClass()}`;
    const label = chip.querySelector('.sync-label');
    if (label) label.textContent = syncLabel();
    chip.title = syncTitle();
  }
  const status = $('#cloud-sync-status');
  if (status) status.textContent = syncStatusText();
}

function scheduleCloudSync(delay = 900) {
  if (!Cloud.user) return;
  markCloudDirty();
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(() => {
    Cloud.timer = null;
    cloudSync();
  }, delay);
}

async function cloudSync({ manual = false } = {}) {
  if (!Cloud.client || !Cloud.user) return false;
  if (!navigator.onLine) {
    updateSyncUI();
    return false;
  }
  if (Cloud.syncing) {
    Cloud.pending = true;
    return false;
  }
  Cloud.syncing = true;
  Cloud.error = '';
  updateSyncUI();
  const payload = JSON.parse(JSON.stringify(S));
  try {
    let { data, error } = await Cloud.client
      .from(CLOUD_TABLE)
      .update({ data: payload })
      .eq('user_id', Cloud.user.id)
      .eq('version', Cloud.version)
      .select('version')
      .maybeSingle();
    if (error) throw error;

    if (!data) {
      const latestResult = await Cloud.client
        .from(CLOUD_TABLE)
        .select('data,version')
        .eq('user_id', Cloud.user.id)
        .maybeSingle();
      if (latestResult.error) throw latestResult.error;
      const latest = latestResult.data;

      if (!latest) {
        const inserted = await Cloud.client
          .from(CLOUD_TABLE)
          .insert({ user_id: Cloud.user.id, data: payload, version: 0 })
          .select('version')
          .maybeSingle();
        if (inserted.error) throw inserted.error;
        data = inserted.data;
      } else {
        Cloud.version = Number(latest.version) || 0;
        const remoteState = normalizeState(latest.data);
        const localTime = Date.parse(S?.meta?.savedAt || '') || 0;
        const remoteTime = Date.parse(remoteState?.meta?.savedAt || '') || 0;
        if (localTime >= remoteTime) {
          const forced = await Cloud.client
            .from(CLOUD_TABLE)
            .update({ data: payload })
            .eq('user_id', Cloud.user.id)
            .eq('version', Cloud.version)
            .select('version')
            .maybeSingle();
          if (forced.error) throw forced.error;
          if (!forced.data) throw new Error('同步冲突，请稍后重试');
          data = forced.data;
        } else if (remoteState) {
          S = remoteState;
          await Store.save(S);
          clearCloudDirty();
          applyTheme();
          renderAll();
          Cloud.lastSyncedAt = new Date();
          toast('已加载云端较新的数据', 'info');
          return true;
        }
      }
    }

    if (data) Cloud.version = Number(data.version) || Cloud.version;
    Cloud.lastSyncedAt = new Date();
    Cloud.error = '';
    clearCloudDirty();
    if (manual) toast('已同步到云端');
    return true;
  } catch (error) {
    Cloud.error = cloudErrorText(error);
    markCloudDirty();
    if (manual) toast('同步失败：' + Cloud.error, 'error');
    return false;
  } finally {
    Cloud.syncing = false;
    updateSyncUI();
    if (Cloud.pending) {
      Cloud.pending = false;
      scheduleCloudSync(400);
    }
  }
}

function isUserEditing() {
  const el = document.activeElement;
  if (!el) return false;
  if (el.matches && el.matches('input,textarea,select,[contenteditable="true"]')) return true;
  return !!(el.closest && el.closest('.modal,[contenteditable="true"]'));
}

async function pullCloud({ manual = false } = {}) {
  if (!Cloud.client || !Cloud.user || Cloud.syncing) return false;
  if (!navigator.onLine) {
    updateSyncUI();
    return false;
  }
  if (isUserEditing() || UI.modal) {
    if (manual) toast('请先完成当前编辑，再同步', 'info');
    return false;
  }
  try {
    const { data, error } = await Cloud.client
      .from(CLOUD_TABLE)
      .select('data,version')
      .eq('user_id', Cloud.user.id)
      .maybeSingle();
    if (error) throw error;
    if (!data) return false;
    const remoteVersion = Number(data.version) || 0;
    if (remoteVersion <= Cloud.version) {
      if (manual) toast('已经是最新数据', 'info');
      return true;
    }
    if (Cloud.dirty) {
      return await cloudSync({ manual });
    }
    const next = normalizeState(data.data);
    if (!next) return false;
    S = next;
    Cloud.version = remoteVersion;
    Cloud.lastSyncedAt = new Date();
    Cloud.error = '';
    await Store.save(S);
    clearCloudDirty();
    applyTheme();
    renderAll();
    updateSyncUI();
    toast('已同步其他设备的最新修改', 'info');
    return true;
  } catch (error) {
    Cloud.error = cloudErrorText(error);
    updateSyncUI();
    if (manual) toast('读取云端失败：' + Cloud.error, 'error');
    return false;
  }
}

async function syncNow() {
  if (!Cloud.user) return;
  if (!navigator.onLine) {
    toast('当前离线，修改已保存在本机，联网后会自动同步', 'info');
    return;
  }
  if (Cloud.dirty) await cloudSync({ manual: true });
  else await pullCloud({ manual: true });
}

async function loadCloudState({ cached, usedGuest }) {
  Cloud.error = '';
  try {
    const { data: row, error } = await Cloud.client
      .from(CLOUD_TABLE)
      .select('data,version')
      .eq('user_id', Cloud.user.id)
      .maybeSingle();
    if (error) throw error;

    if (row) {
      Cloud.version = Number(row.version) || 0;
      const remote = normalizeState(row.data);
      if (remote) {
        if (Cloud.dirty && cached) {
          /* 本机有未上传的修改，先保留本机，随后自动上传 */
          await Store.save(S);
          scheduleCloudSync(500);
        } else {
          S = remote;
          await Store.save(S);
          clearCloudDirty();
          Cloud.lastSyncedAt = new Date();
        }
      } else {
        /* 云端还是空行：把当前本机数据作为初始工作台上传 */
        if (usedGuest) claimGuest();
        await Store.save(S);
        await cloudSync();
      }
    } else {
      /* 触发器没有建行时，客户端自己补一行 */
      Cloud.version = 0;
      if (usedGuest) claimGuest();
      await Store.save(S);
      await cloudSync();
    }
  } catch (error) {
    Cloud.error = cloudErrorText(error);
    await Store.save(S).catch(() => {});
  }
  Cloud.ready = true;
  updateSyncUI();
}

async function enterApp(user) {
  if (!user) return;
  if (Cloud.user?.id === user.id && Cloud.ready) {
    hideAuthScreen();
    return;
  }
  if (AUTH.entering) return;
  AUTH.entering = true;
  try {
    Cloud.user = user;
    Cloud.ready = false;
    Cloud.error = '';
    Cloud.version = 0;
    Cloud.syncing = false;
    Cloud.pending = false;
    Cloud.dirtyKey = CLOUD_DIRTY_PREFIX + user.id;
    Store.setScope(user.id);

    const cachedRaw = await Store.load().catch(() => null);
    const cached = normalizeState(cachedRaw);
    let usedGuest = false;
    if (cached) {
      S = cached;
    } else if (!guestClaimed() && S) {
      usedGuest = true;
    } else {
      S = createEmptyState(S?.settings?.theme || 'system');
    }
    Cloud.dirty = isCloudDirty();
    applyTheme();
    await loadCloudState({ cached: !!cached, usedGuest });
    Cloud.ready = true;
    hideAuthScreen();
    renderAll(true);
  } catch (error) {
    Cloud.error = cloudErrorText(error);
    showAuthScreen('进入工作台失败：' + Cloud.error, 'error');
  } finally {
    AUTH.entering = false;
  }
}

function leaveApp() {
  Cloud.user = null;
  Cloud.ready = false;
  Cloud.version = 0;
  Cloud.syncing = false;
  Cloud.pending = false;
  Cloud.error = '';
  Cloud.lastSyncedAt = null;
  clearTimeout(Cloud.timer);
  Store.setScope('guest');
  document.body.classList.add('auth-locked');
  const screen = $('#auth-screen');
  if (screen) screen.hidden = false;
  setAuthMode('login');
  setAuthMessage('info', '已退出登录。');
}

async function logout() {
  if (!Cloud.client) return;
  const { error } = await Cloud.client.auth.signOut();
  if (error) toast('退出登录失败：' + cloudErrorText(error), 'error');
}

function setAuthMessage(kind, text) {
  const box = $('#auth-message');
  if (!box) return;
  if (!text) {
    box.hidden = true;
    box.textContent = '';
    box.className = 'auth-message';
    return;
  }
  box.hidden = false;
  box.className = `auth-message ${kind || 'info'}`;
  box.textContent = text;
}

function authButtonText(mode) {
  if (mode === 'signup') return '注册';
  if (mode === 'reset-request') return '发送重置邮件';
  if (mode === 'reset-password') return '保存新密码';
  return '登录';
}

function setAuthBusy(busy) {
  AUTH.busy = !!busy;
  const btn = $('#auth-submit');
  if (!btn) return;
  btn.disabled = !!busy;
  btn.textContent = busy ? '请稍候…' : authButtonText(AUTH.mode);
}

function setAuthMode(mode) {
  const allowed = ['login', 'signup', 'reset-request', 'reset-password'];
  AUTH.mode = allowed.includes(mode) ? mode : 'login';
  const copy = {
    login: ['登录工作台', '使用邮箱登录，数据会在你的设备之间自动同步。'],
    signup: ['创建账号', '注册后你会得到一个独立的工作台，其他人看不到你的数据。'],
    'reset-request': ['找回密码', '输入注册邮箱，我们会发送一封重置密码邮件。'],
    'reset-password': ['设置新密码', '请输入新的密码，至少 6 位。']
  };
  const text = copy[AUTH.mode];
  const title = $('#auth-title');
  const sub = $('#auth-sub');
  if (title) title.textContent = text[0];
  if (sub) sub.textContent = text[1];

  $$('#auth-tabs .auth-tab').forEach(tab => {
    const active = tab.dataset.authTab === AUTH.mode;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  const tabs = $('#auth-tabs');
  if (tabs) tabs.hidden = AUTH.mode.startsWith('reset');
  $$('#auth-screen [data-auth-only]').forEach(el => {
    const modes = String(el.dataset.authOnly || '').split(/\s+/).filter(Boolean);
    el.hidden = !modes.includes(AUTH.mode);
  });

  const emailField = $('[data-auth-field="email"]');
  const passwordField = $('[data-auth-field="password"]');
  const emailInput = $('#auth-email');
  const passwordInput = $('#auth-password');
  if (emailField) emailField.hidden = AUTH.mode === 'reset-password';
  if (passwordField) passwordField.hidden = AUTH.mode === 'reset-request';
  if (emailInput) {
    emailInput.required = AUTH.mode !== 'reset-password';
    emailInput.autocomplete = AUTH.mode === 'signup' ? 'email' : 'username';
  }
  if (passwordInput) {
    passwordInput.required = AUTH.mode !== 'reset-request';
    passwordInput.autocomplete = AUTH.mode === 'login' ? 'current-password' : 'new-password';
  }
  setAuthMessage('', '');
  setAuthBusy(false);
}

function translateAuthError(error) {
  const message = cloudErrorText(error);
  if (/Invalid login credentials/i.test(message)) return '邮箱或密码错误，请重新输入。';
  if (/Email not confirmed/i.test(message)) return '邮箱尚未验证，请先点击验证邮件中的链接。';
  if (/User already registered/i.test(message)) return '该邮箱已注册，请直接登录。';
  if (/Password should be at least/i.test(message)) return '密码至少需要 6 位。';
  if (/rate limit|too many|For security purposes/i.test(message)) return '操作太频繁，请稍等一分钟再试。';
  if (/Invalid email/i.test(message)) return '邮箱格式不正确。';
  if (/Failed to fetch|NetworkError|Load failed/i.test(message)) return '网络连接失败，请检查网络后重试。';
  return message || '操作失败，请稍后重试。';
}

function showAuthScreen(message, kind = 'info') {
  document.body.classList.add('auth-locked');
  const screen = $('#auth-screen');
  if (screen) screen.hidden = false;
  if (message) setAuthMessage(kind, message);
}

function hideAuthScreen() {
  const screen = $('#auth-screen');
  if (screen) screen.hidden = true;
  document.body.classList.remove('auth-locked');
}

function onAuthClick(event) {
  const tab = event.target.closest ? event.target.closest('[data-auth-tab]') : null;
  if (tab) {
    setAuthMode(tab.dataset.authTab);
    return;
  }
  const actionEl = event.target.closest ? event.target.closest('[data-auth-action]') : null;
  if (!actionEl) return;
  const action = actionEl.dataset.authAction;
  if (action === 'forgot') {
    const email = String($('#auth-email')?.value || '').trim();
    setAuthMode('reset-request');
    if (email && $('#auth-email')) $('#auth-email').value = email;
  } else if (action === 'back') {
    setAuthMode('login');
  }
}

async function onAuthSubmit(event) {
  event.preventDefault();
  if (AUTH.busy) return;
  if (!Cloud.client) {
    setAuthMessage('error', '云同步组件尚未加载，请刷新页面重试。');
    return;
  }
  const mode = AUTH.mode;
  const email = String($('#auth-email')?.value || '').trim();
  const password = String($('#auth-password')?.value || '');

  if (mode !== 'reset-password' && !email) {
    setAuthMessage('error', '请填写邮箱。');
    return;
  }
  if (mode !== 'reset-password' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setAuthMessage('error', '邮箱格式不正确。');
    return;
  }
  if (mode !== 'reset-request' && password.length < 6) {
    setAuthMessage('error', '密码至少需要 6 位。');
    return;
  }

  setAuthBusy(true);
  setAuthMessage('', '');
  try {
    if (mode === 'login') {
      const { error } = await Cloud.client.auth.signInWithPassword({ email, password });
      if (error) throw error;
      const { data } = await Cloud.client.auth.getSession();
      if (data.session?.user) await enterApp(data.session.user);
    } else if (mode === 'signup') {
      const { data, error } = await Cloud.client.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: authRedirectUrl() }
      });
      if (error) throw error;
      if (data.session?.user) {
        await enterApp(data.session.user);
      } else {
        setAuthMode('login');
        setAuthMessage('success', '注册成功。请到邮箱点击确认链接，然后回来登录。');
      }
    } else if (mode === 'reset-request') {
      const { error } = await Cloud.client.auth.resetPasswordForEmail(email, {
        redirectTo: authRedirectUrl()
      });
      if (error) throw error;
      setAuthMessage('success', '重置邮件已发送，请查收邮箱（包括垃圾邮件）。');
    } else if (mode === 'reset-password') {
      const { error } = await Cloud.client.auth.updateUser({ password });
      if (error) throw error;
      setAuthMessage('success', '密码已更新，正在进入工作台…');
      const { data } = await Cloud.client.auth.getSession();
      if (data.session?.user) await enterApp(data.session.user);
    }
  } catch (error) {
    setAuthMessage('error', translateAuthError(error));
  } finally {
    setAuthBusy(false);
  }
}

function bindAuthUI() {
  if (AUTH.bound) return;
  AUTH.bound = true;
  const screen = $('#auth-screen');
  if (screen) screen.addEventListener('click', onAuthClick);
  const form = $('#auth-form');
  if (form) form.addEventListener('submit', onAuthSubmit);
}

function initCloudAuth() {
  bindAuthUI();
  const sb = initSupabase();
  if (!sb) return false;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      showAuthScreen();
      setAuthMode('reset-password');
      setAuthMessage('info', '请输入新密码。');
      return;
    }
    if (event === 'SIGNED_OUT') {
      leaveApp();
      return;
    }
    if (session?.user && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED')) {
      void enterApp(session.user);
    }
  });
  return true;
}

/* =========================================================
   六、查询与计算辅助
   ========================================================= */
const projectById = id => S.projects.find(p => p.id === id) || null;
const taskById = id => S.tasks.find(t => t.id === id) || null;

function walkLeaves(nodes, acc = []) {
  (nodes || []).forEach(node => {
    if (node.children && node.children.length) walkLeaves(node.children, acc);
    else acc.push(node);
  });
  return acc;
}
function countNodes(nodes) {
  return (nodes || []).reduce((sum, node) => sum + 1 + countNodes(node.children), 0);
}
function projectProgress(project) {
  const leaves = walkLeaves(project.subtasks || []);
  if (!leaves.length) return clamp(Math.round(project.progress || 0), 0, 100);
  const done = leaves.filter(leaf => leaf.done).length;
  /* 未全部完成时最高显示 99%，确保「100%」与「已完成」严格一致 */
  if (done < leaves.length) return Math.min(99, Math.round(done / leaves.length * 100));
  return 100;
}
function projectIsComplete(project) {
  return projectProgress(project) >= 100;
}
/* 已完成由进度自动推导；底层 status 保持不变，进度回落后可回到原分组 */
function projectDisplayStatus(project) {
  if (!project) return 'ongoing';
  if (projectIsComplete(project)) return 'completed';
  return BASE_STATUS_ORDER.includes(project.status) ? project.status : 'ongoing';
}
function projectsWithStatus(status) {
  return S.projects.filter(project => projectDisplayStatus(project) === status);
}
function updateProjectProgress(project) {
  project.progress = projectProgress(project);
}
function announceProjectStatusChange(beforeStatus, project) {
  const afterStatus = projectDisplayStatus(project);
  if (beforeStatus === afterStatus) return;
  if (afterStatus === 'completed') {
    toast('项目已完成，已自动归档到「已完成」');
  } else {
    toast(`项目已重新开启，移回「${PROJECT_STATUS[afterStatus].label}」`, 'info');
  }
}
function completedThisWeek() {
  const start = startOfWeek(new Date()).getTime();
  return S.tasks
    .filter(t => t.status === 'completed' && t.completedAt && new Date(t.completedAt).getTime() >= start)
    .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
}
function pendingTasksSorted() {
  const now = new Date();
  return S.tasks.filter(t => t.status === 'pending').sort((a, b) => {
    const dueA = new Date(a.dueAt), dueB = new Date(b.dueAt);
    const overA = dueA < now, overB = dueB < now;
    if (overA !== overB) return overA ? -1 : 1;
    const todayA = sameDay(dueA, now), todayB = sameDay(dueB, now);
    if (todayA !== todayB) return todayA ? -1 : 1;
    const priority = (PRIORITIES[a.priority]?.rank ?? 9) - (PRIORITIES[b.priority]?.rank ?? 9);
    if (priority !== 0) return priority;
    return dueA - dueB;
  });
}
function dueMeta(task) {
  const due = new Date(task.dueAt);
  const now = new Date();
  const sameToday = sameDay(due, now);
  const tomorrow = sameDay(due, addDays(now, 1));
  const yesterday = sameDay(due, addDays(now, -1));
  const overdue = task.status === 'pending' && due.getTime() < now.getTime();
  let text;
  if (sameToday) text = `今天 ${hm(due)}`;
  else if (tomorrow) text = `明天 ${hm(due)}`;
  else if (yesterday) text = `昨天 ${hm(due)}`;
  else text = `${due.getMonth() + 1}月${due.getDate()}日 ${hm(due)}`;
  if (overdue) {
    const days = Math.floor((startOfDay(now) - startOfDay(due)) / 86400000);
    text = days >= 1 ? `已逾期 ${days} 天` : `已逾期 · ${hm(due)}`;
  }
  return { text, overdue, today: sameToday };
}
function completedTimeText(value) {
  if (!value) return '';
  const d = new Date(value);
  const now = new Date();
  if (sameDay(d, now)) return `今天 ${hm(d)}`;
  if (sameDay(d, addDays(now, -1))) return `昨天 ${hm(d)}`;
  return `${monthDay(d)} ${hm(d)}`;
}
function logFor(key) {
  return S.logs.find(log => log.date === key) || null;
}
function lastNDates(n) {
  const result = [];
  const base = startOfDay(new Date());
  for (let i = n - 1; i >= 0; i--) {
    const d = addDays(base, -i);
    result.push({ date: dateISO(d), dateObj: d });
  }
  return result;
}
function lastNDaysStats(n = 30) {
  const days = lastNDates(n);
  let total = 0, onTime = 0, focusMin = 0;
  const countsByProject = {};
  days.forEach(day => {
    const log = logFor(day.date);
    if (!log) return;
    total += log.total || 0;
    onTime += log.onTime || 0;
    focusMin += log.focusMin || 0;
    Object.entries(log.counts || {}).forEach(([pid, count]) => {
      countsByProject[pid] = (countsByProject[pid] || 0) + count;
    });
  });
  const todayLog = logFor(todayISO());
  return { days, total, onTime, focusMin, countsByProject, todayLog };
}
function adjustLog(dateKey, projectId, delta, onTimeDelta, focusDelta) {
  let log = logFor(dateKey);
  if (!log) {
    log = { date: dateKey, counts: {}, total: 0, onTime: 0, focusMin: 0 };
    S.logs.push(log);
    S.logs.sort((a, b) => a.date.localeCompare(b.date));
  }
  const pid = projectId || 'unassigned';
  log.counts[pid] = Math.max(0, (log.counts[pid] || 0) + delta);
  if (log.counts[pid] === 0) delete log.counts[pid];
  log.total = Math.max(0, log.total + delta);
  log.onTime = clamp(log.onTime + onTimeDelta, 0, log.total);
  log.focusMin = Math.max(0, log.focusMin + focusDelta);
}
function scheduledEventForTask(taskId) {
  return S.events.find(event => event.taskId === taskId) || null;
}
function upcomingTodayEvents() {
  const now = new Date();
  return S.events
    .filter(event => event.date === todayISO() && minutesOf(event.end) >= now.getHours() * 60 + now.getMinutes())
    .sort((a, b) => minutesOf(a.start) - minutesOf(b.start));
}
function todayEvents() {
  return S.events
    .filter(event => event.date === todayISO())
    .sort((a, b) => minutesOf(a.start) - minutesOf(b.start));
}
function greeting() {
  const hour = new Date().getHours();
  if (hour < 5) return '夜深了';
  if (hour < 11) return '早上好';
  if (hour < 13) return '中午好';
  if (hour < 18) return '下午好';
  if (hour < 23) return '晚上好';
  return '夜深了';
}
function memberPill(name) {
  return `<span class="avatar-sm" style="--av:${avatarColor(name)}" title="${escapeHTML(name)}">${escapeHTML(initialOf(name))}</span>`;
}
function membersHTML(members = []) {
  const shown = members.slice(0, 3);
  const rest = members.length - shown.length;
  return `<div class="pmembers avatars">${shown.map(memberPill).join('')}${rest > 0 ? `<span class="avatar-sm avatar-more">+${rest}</span>` : ''}</div>`;
}

const SHORT_PROJECT_NAMES = {
  p1: '3.0 发布', p2: '看板二期', p3: '文档站', p4: '网关迁移',
  p5: '技术分享', p6: '品牌规范', p7: '埋点联调'

function projectShortLabel(project) {
  if (!project) return '未分组';
  return project.short || SHORT_PROJECT_NAMES[project.id] || clampText(project.name, 7);
}
function projectTagHTML(projectId) {
  const project = projectById(projectId);
  if (!project) return `<span class="tag neutral">收件箱</span>`;
  return `<span class="tag" style="--pc:${colorOf(project)}">${escapeHTML(projectShortLabel(project))}</span>`;
}
function priorityHTML(priority) {
  const meta = PRIORITIES[priority] || PRIORITIES.medium;
  return `<span class="prio ${meta.cls}" title="${meta.label}优先级">${meta.label}优先</span>`;
}
function nextMilestoneText(project) {
  if (projectIsComplete(project)) return '项目已完成 · 所有子任务已勾选';
  const leaves = walkLeaves(project.subtasks || []);
  const next = leaves.find(leaf => !leaf.done);
  const end = fromISO(project.endDate);
  const days = Math.ceil((startOfDay(end) - startOfDay(new Date())) / 86400000);
  let deadline;
  if (days < 0) deadline = `已超期 ${Math.abs(days)} 天`;
  else if (days === 0) deadline = '今天截止';
  else deadline = `${days} 天后截止`;
  if (next) return `${deadline} · ${next.title}`;
  if (project.status === 'under-review') return `等待评审 · ${deadline}`;
  return `子任务已全部完成 · ${deadline}`;
}

function renderSubtaskInput(projectId, parentId, depth) {
  return `
    <div class="sub-input-row" style="padding-left:${7 + depth * 18}px">
      <input class="sub-input" data-project="${projectId}" data-parent="${parentId}"
        maxlength="100" placeholder="输入子任务，Enter 保存，Esc 取消"
        aria-label="新子任务名称">
    </div>`;
}

function renderSubtree(nodes, projectId, depth) {
  return (nodes || []).map(node => {
    const hasChildren = node.children && node.children.length;
    const addingHere = UI.addingSubtask && UI.addingSubtask.projectId === projectId && UI.addingSubtask.parentId === node.id;
    const inTodo = S.tasks.some(task => task.status === 'pending' && task.projectId === projectId && task.title.trim() === node.title.trim());
    return `
      <div class="sub-node">
        <div class="sub-row ${node.done ? 'done' : ''}" style="padding-left:${7 + depth * 18}px">
          <button class="sub-check" data-action="toggle-subtask" data-project="${projectId}" data-id="${node.id}"
            aria-label="${node.done ? '取消完成' : '标记完成'}：${escapeHTML(node.title)}" title="${node.done ? '取消完成' : '标记完成'}">${icon('check')}</button>
          <span class="sub-title">${escapeHTML(node.title)}</span>
          ${hasChildren ? `<span class="sub-count">${node.children.filter(child => child.done).length}/${node.children.length}</span>` : ''}
          <span class="sub-actions">
            <button class="icon-mini" data-action="add-subtask" data-project="${projectId}" data-parent="${node.id}" title="添加子任务">${icon('plus')}</button>
            <button class="icon-mini todo ${inTodo ? 'is-added' : ''}" data-action="subtask-to-todo" data-project="${projectId}" data-id="${node.id}"
              title="${inTodo ? '已在待办中' : '一键添加到待办'}" aria-label="${inTodo ? '已在待办中' : '一键添加「' + escapeHTML(node.title) + '」到待办'}"
              ${inTodo ? 'disabled' : ''}>${icon(inTodo ? 'check' : 'inbox')}</button>
            <button class="icon-mini danger" data-action="delete-subtask" data-project="${projectId}" data-id="${node.id}" title="删除该任务">${icon('trash')}</button>
          </span>
        </div>
        ${addingHere ? renderSubtaskInput(projectId, node.id, depth + 1) : ''}
        ${hasChildren ? `<div class="subtree">${renderSubtree(node.children, projectId, depth + 1)}</div>` : ''}
      </div>`;
  }).join('');
}

function renderProjectDetail(project) {
  const leaves = walkLeaves(project.subtasks || []);
  const doneLeaves = leaves.filter(leaf => leaf.done).length;
  const rootAdding = UI.addingSubtask && UI.addingSubtask.projectId === project.id && UI.addingSubtask.parentId === '';
  const depOptions = S.projects.filter(other => other.id !== project.id)
    .map(other => `<option value="${other.id}" ${project.dependsOn === other.id ? 'selected' : ''}>${escapeHTML(other.name)}</option>`)

  return `
    <div class="project-detail">

        <div class="detail-label">
          <span>任务拆解</span>
          <span class="hint">${doneLeaves}/${leaves.length} 已勾选 · 支持任意层级</span>
        </div>
        <div class="subtree">${renderSubtree(project.subtasks || [], project.id, 0)}</div>
        ${rootAdding ? renderSubtaskInput(project.id, '', 0) : ''}
        <button class="add-root-sub" data-action="add-subtask" data-project="${project.id}" data-parent="">${icon('plus')} 添加任务</button>

    <div class="pgroup-empty">

/* =========================================================
   十二、日程视图
   ========================================================= */
function layoutDayEvents(events) {
  const sorted = [...events]
    .filter(event => minutesOf(event.end) > 8 * 60 && minutesOf(event.start) < 20 * 60)
    .sort((a, b) => minutesOf(a.start) - minutesOf(b.start) || minutesOf(b.end) - minutesOf(a.end));
  const groups = [];
  let current = [];
  let groupEnd = -1;
  sorted.forEach(event => {
    const start = minutesOf(event.start);
    const end = minutesOf(event.end);
    if (current.length && start >= groupEnd) {
      groups.push(current);
      current = [];
      groupEnd = -1;
    }
    current.push(event);
    groupEnd = Math.max(groupEnd, end);
  });
  if (current.length) groups.push(current);

  const result = [];
  groups.forEach(group => {
    const columnEnds = [];
    const placements = [];
    group.forEach(event => {
      const start = minutesOf(event.start);
      const end = minutesOf(event.end);
      let col = columnEnds.findIndex(colEnd => colEnd <= start);
      if (col === -1) {
        col = columnEnds.length;
        columnEnds.push(end);
      } else {
        columnEnds[col] = end;
      }
      placements.push({ event, col });
    });
    const cols = columnEnds.length;
    placements.forEach(({ event, col }) => result.push({ ...event, _col: col, _cols: cols }));
  });
  return result;
}

function calendarEventHTML(event) {
  const type = EVENT_TYPES[event.type] || EVENT_TYPES.meeting;
  const rawStart = minutesOf(event.start);
  const rawEnd = Math.max(rawStart + 15, minutesOf(event.end));
  const start = clamp(rawStart, 8 * 60, 20 * 60);
  const end = clamp(rawEnd, start + 15, 20 * 60);
  const top = (start - 480) / 60 * 64 + 2;
  const height = Math.max(24, (end - start) / 60 * 64 - 4);
  const compact = height < 46;
  const cols = event._cols || 1;
  const col = event._col || 0;
  const left = cols > 1 ? `calc(${(col / cols) * 100}% + 6px)` : '6px';
  const width = cols > 1 ? `calc(${100 / cols}% - 10px)` : 'calc(100% - 12px)';
  const now = new Date();
  const eventDate = fromISO(event.date);
  const past = startOfDay(eventDate) < startOfDay(now) ||
    (sameDay(eventDate, now) && minutesOf(event.end) < now.getHours() * 60 + now.getMinutes());
  return `
    <div class="cal-event ${compact ? 'compact' : ''} ${past ? 'past' : ''}" draggable="true"
      data-drag-event="${event.id}" data-action="open-event" data-id="${event.id}"
      style="--ec:${type.color};top:${top.toFixed(1)}px;height:${height.toFixed(1)}px;left:${left};width:${width}"
      title="${escapeHTML(event.title)} · ${event.start}–${event.end}${event.location ? ' · ' + escapeHTML(event.location) : ''}">
      ${compact
        ? `<div class="ev-title"><span class="ev-dot"></span>${escapeHTML(event.title)}</div>`
        : `<div class="ev-time">${event.start} – ${event.end}${event.location ? ' · ' + escapeHTML(event.location) : ''}</div><div class="ev-title">${escapeHTML(event.title)}</div>`}
    </div>`;
}

function renderDayView(dateKey) {
  const date = fromISO(dateKey);
  const isToday = dateKey === todayISO();
  const hours = Array.from({ length: 12 }, (_, i) => i + 8);
  const events = S.events.filter(event => event.date === dateKey);
  const laidOut = layoutDayEvents(events);
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const showNow = isToday && nowMinutes >= 480 && nowMinutes <= 1200;
  return `
    <div class="day-shell">
      <div class="day-head">
        <span><b>${weekdayCN[date.getDay()]}</b> · ${monthDay(date)} · 08:00 – 20:00</span>
        <span>${events.length} 个日程 · 可拖拽调整</span>
      </div>
      <div class="day-scroll" id="day-scroll">
        <div class="day-grid">
          <div class="time-col">
            ${hours.map(hour => `<div class="time-label">${pad2(hour)}:00</div>`).join('')}
          </div>
          <div class="slots" id="day-slots">
            ${hours.map(hour => `
              <div class="day-slot" data-date="${dateKey}" data-hour="${hour}" style="top:${(hour - 8) * 64}px">
                <span class="slot-plus">${icon('plus')} 点击新建 · 拖入任务</span>
              </div>`).join('')}
            ${!events.length ? `<div class="day-empty-hint">${icon('calendar-plus')}<span>这一天还很空<br>把右侧任务拖进时间槽开始排期</span></div>` : ''}
            <div class="events-layer">
              ${laidOut.map(calendarEventHTML).join('')}
              ${showNow ? `<div class="now-line" style="top:${((nowMinutes - 480) / 60 * 64).toFixed(1)}px"><span class="now-chip">${hm(now)}</span></div>` : ''}
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function renderWeekView(anchorKey) {
  const anchor = fromISO(anchorKey);
  const start = startOfWeek(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  return `
    <div class="week-grid">
      ${days.map(day => {
        const key = dateISO(day);
        const events = S.events.filter(event => event.date === key).sort((a, b) => minutesOf(a.start) - minutesOf(b.start));
        const isToday = key === todayISO();
        return `
          <div class="week-col ${isToday ? 'today' : ''}">
            <button class="week-head ${isToday ? 'today' : ''}" data-action="pick-day" data-date="${key}" title="查看 ${monthDay(day)}">
              <div class="week-wd">${weekdayCN[day.getDay()]}</div>
              <div class="week-date">${day.getDate()}</div>
            </button>
            ${events.slice(0, 6).map(event => {
              const type = EVENT_TYPES[event.type] || EVENT_TYPES.meeting;
              return `<button class="week-event" data-action="open-event" data-id="${event.id}" style="--ec:${type.color}" title="${escapeHTML(event.title)} · ${event.start} – ${event.end}">
                <b>${escapeHTML(event.title)}</b>
                <span><i class="ev-dot"></i>${event.start} – ${event.end}</span>
              </button>`;
            }).join('')}
            ${!events.length ? `<div class="week-empty">暂无安排</div>` : ''}
            ${events.length > 6 ? `<div class="week-empty" style="border:none;padding:4px">还有 ${events.length - 6} 个日程</div>` : ''}
            <button class="week-add" data-action="new-event-date" data-date="${key}">${icon('plus')} 添加日程</button>
          </div>`;
      }).join('')}
    </div>`;
}

function renderMonthView(anchorKey) {
  const anchor = fromISO(anchorKey);
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const gridStart = startOfWeek(first);
  const days = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
  return `
    <div class="month-shell">
      <div class="month-weekdays">${['一', '二', '三', '四', '五', '六', '日'].map(d => `<span>周${d}</span>`).join('')}</div>
      <div class="month-grid">
        ${days.map(day => {
          const key = dateISO(day);
          const events = S.events.filter(event => event.date === key).sort((a, b) => minutesOf(a.start) - minutesOf(b.start));
          const out = day.getMonth() !== anchor.getMonth();
          const isToday = key === todayISO();
          return `
            <div class="month-cell ${out ? 'out' : ''} ${isToday ? 'today' : ''}" data-action="pick-day" data-date="${key}" title="${monthDay(day)} · ${events.length} 个日程">
              <div class="mdate">${day.getDate()}</div>
              ${events.slice(0, 2).map(event => {
                const type = EVENT_TYPES[event.type] || EVENT_TYPES.meeting;
                return `<div class="month-event" style="--ec:${type.color}"><i></i>${escapeHTML(event.title)}</div>`;
              }).join('')}
              ${events.length > 2 ? `<div class="month-more">+${events.length - 2} 更多</div>` : ''}
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

function calendarLabel() {
  const d = fromISO(UI.scheduleDate);
  if (UI.scheduleView === 'day') {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · ${weekdayCN[d.getDay()]}`;
  }
  if (UI.scheduleView === 'week') {
    const start = startOfWeek(d);
    const end = addDays(start, 6);
    return `${start.getMonth() + 1}月${start.getDate()}日 – ${end.getMonth() + 1}月${end.getDate()}日`;
  }
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
}

function renderScheduleSide() {
  const unscheduled = pendingTasksSorted().filter(task => !scheduledEventForTask(task.id));
  const legend = Object.entries(EVENT_TYPES)
    .map(([key, meta]) => `<span class="legend-item"><i style="--ec:${meta.color}"></i>${meta.label}</span>`).join('');
  return `
    <aside class="schedule-side">
      <div class="side-card">
        <div class="side-head">
          <div class="side-title">待排期任务 <span class="count-pill">${unscheduled.length}</span></div>
        </div>
        <p class="side-hint">拖动任务到日历的时间槽，即可创建对应的时间块。</p>
        <div class="drag-list">
          ${unscheduled.length ? unscheduled.map(task => {
            const due = dueMeta(task);
            return `
              <div class="drag-task" draggable="true" data-drag-task="${task.id}" title="拖拽到左侧日历进行排期">
                <span class="grip">${icon('grip')}</span>
                <div class="drag-body">
                  <div class="drag-title">${escapeHTML(task.title)}</div>
                  <div class="drag-meta">
                    ${projectTagHTML(task.projectId)}

                  </div>
                </div>
              </div>`;
          }).join('') : `
            <div class="side-empty">${icon('check-circle')}<span>所有待办都已排期<br>或已经完成。</span></div>`}
        </div>
        <div class="side-legend">${legend}</div>
        <div class="side-tip">${icon('info')}<span>把日程块拖到其它时间槽可调整时间；点击日程可编辑或删除，删除后任务会回到待排期列表。</span></div>
      </div>
    </aside>`;
}

function renderSchedule() {
  let body = '';
  if (UI.scheduleView === 'day') body = renderDayView(UI.scheduleDate);
  else if (UI.scheduleView === 'week') body = renderWeekView(UI.scheduleDate);
  else body = renderMonthView(UI.scheduleDate);
  return `
    <div class="schedule-grid">
      <section class="calendar-card card">
        <div class="cal-toolbar">
          <div class="cal-left">

/* =========================================================
   十三、数据分析视图
   ========================================================= */
function smoothPath(points) {
  if (!points.length) return '';
  if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
  let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}

function renderTrendChart(stats) {
  const values = stats.days.map(day => logFor(day.date)?.total || 0);
  const W = 920, H = 252, PL = 34, PR = 14, PT = 18, PB = 30;
  const innerW = W - PL - PR;
  const innerH = H - PT - PB;
  const yMax = Math.max(4, Math.ceil(Math.max(1, ...values) / 2) * 2);
  const stepX = values.length > 1 ? innerW / (values.length - 1) : 0;
  const x = i => PL + i * stepX;
  const y = v => PT + (1 - v / yMax) * innerH;
  const points = values.map((value, i) => ({ x: x(i), y: y(value), value }));
  const line = smoothPath(points);
  const area = `${line} L ${x(values.length - 1).toFixed(2)} ${(PT + innerH).toFixed(2)} L ${x(0).toFixed(2)} ${(PT + innerH).toFixed(2)} Z`;
  const average = values.reduce((sum, value) => sum + value, 0) / values.length;
  const grid = [0, 1, 2, 3, 4].map(k => {
    const value = yMax / 4 * k;
    const yy = y(value);
    return `<line class="grid-line" x1="${PL}" y1="${yy.toFixed(2)}" x2="${W - PR}" y2="${yy.toFixed(2)}"/>
      <text class="axis-label" x="${PL - 8}" y="${(yy + 3).toFixed(2)}" text-anchor="end">${Number.isInteger(value) ? value : value.toFixed(1)}</text>`;
  }).join('');
  const labelIndexes = [0, 5, 10, 15, 20, 25, 29].filter(i => i < values.length);
  const xLabels = labelIndexes.map(i => {
    const d = stats.days[i].dateObj;
    return `<text class="axis-label" x="${x(i).toFixed(2)}" y="${H - 9}" text-anchor="${i === 0 ? 'start' : i === values.length - 1 ? 'end' : 'middle'}">${d.getMonth() + 1}/${d.getDate()}</text>`;
  }).join('');
  const hits = points.map((point, i) => `
    <rect class="chart-hit" data-i="${i}" x="${(x(i) - stepX / 2).toFixed(2)}" y="${PT}" width="${stepX.toFixed(2)}" height="${innerH}"/>`).join('');
  const last = points[points.length - 1];
  return `
    <div class="chart-wrap" id="chart-wrap">
      <svg class="chart-svg" id="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 30 天每日完成任务数趋势">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity=".20"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}
        <line class="avg-line" x1="${PL}" y1="${y(average).toFixed(2)}" x2="${W - PR}" y2="${y(average).toFixed(2)}"/>
        <text class="avg-label" x="${W - PR}" y="${(y(average) - 5).toFixed(2)}" text-anchor="end">平均 ${average.toFixed(1)} 项</text>
        <path class="trend-area" d="${area}"/>
        <path class="trend-line-glow" d="${line}"/>
        <path class="trend-line" d="${line}"/>
        <circle cx="${last.x.toFixed(2)}" cy="${last.y.toFixed(2)}" r="3.3" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>
        <g id="chart-focus" style="opacity:0">
          <line x1="0" y1="${PT}" x2="0" y2="${PT + innerH}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 4"/>
          <circle r="4.2" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
        </g>
        ${xLabels}
        ${hits}
      </svg>
      <div class="chart-tip" id="chart-tip"></div>
    </div>`;
}

function renderDonut(stats) {
  const entries = Object.entries(stats.countsByProject)
    .map(([projectId, count]) => {
      const project = projectById(projectId);
      return {
        projectId,
        name: project ? project.name : (projectId === 'unassigned' ? '未分组' : '已归档项目'),
        color: project ? colorOf(project) : '#94a3b8',
        count
      };
    })
    .filter(entry => entry.count > 0)
    .sort((a, b) => b.count - a.count);
  let display = entries;
  let otherCount = 0;
  if (entries.length > 6) {
    display = entries.slice(0, 5);
    otherCount = entries.slice(5).reduce((sum, entry) => sum + entry.count, 0);
  }
  if (otherCount) display = display.concat([{ name: '其他项目', color: '#94a3b8', count: otherCount }]);
  const total = display.reduce((sum, entry) => sum + entry.count, 0) || 1;
  const radius = 64;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  const segments = display.map(entry => {
    const length = entry.count / total * circumference;
    const dash = Math.max(0.5, length - 2.2);
    const markup = `<circle class="donut-seg" cx="90" cy="90" r="${radius}" fill="none"
      stroke="${entry.color}" stroke-width="22"
      stroke-dasharray="${dash.toFixed(2)} ${(circumference - dash).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}">
      <title>${escapeHTML(entry.name)} · ${entry.count} 项 · ${Math.round(entry.count / total * 100)}%</title>
    </circle>`;
    offset += length;
    return markup;
  }).join('');
  const legend = display.map(entry => `
    <div class="legend-row">
      <span class="legend-dot" style="--lc:${entry.color}"></span>
      <span class="legend-name" title="${escapeHTML(entry.name)}">${escapeHTML(entry.name)}</span>
      <span class="legend-count">${entry.count}</span>
      <span class="legend-pct">${Math.round(entry.count / total * 100)}%</span>
    </div>`).join('');
  return `
    <div class="donut-body">
      <div class="donut-wrap">
        <svg viewBox="0 0 180 180" role="img" aria-label="近 30 天各项目任务占比环形图">${segments}</svg>
        <div class="donut-center">
          <strong>${stats.total}</strong>
          <span>完成任务</span>
          <em>覆盖 ${entries.length} 个项目</em>
        </div>
      </div>
      <div class="legend-list">
        ${display.length ? legend : `<div class="legend-empty">还没有可统计的任务，完成一项任务后这里会出现精力分布。</div>`}
      </div>
    </div>`;
}

function renderDataAnalysis() {
  const stats = lastNDaysStats(30);
  const rate = stats.total ? clamp(Math.round(stats.onTime / stats.total * 100), 0, 100) : 0;
  const focusHours = stats.focusMin / 60;
  const now = new Date();
  const sumRange = (fromAgo, toAgo) => {
    let sum = 0;
    for (let i = fromAgo; i <= toAgo; i++) {
      sum += logFor(dateISO(addDays(now, -i)))?.total || 0;
    }
    return sum;
  };
  const last7 = sumRange(0, 6);
  const prev7 = sumRange(7, 13);
  const delta = prev7 > 0 ? Math.round((last7 - prev7) / prev7 * 100) : null;
  const pendingOverdue = S.tasks
    .filter(task => task.status === 'pending' && new Date(task.dueAt) < now)
    .sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt));
  const overdueByProject = {};
  pendingOverdue.forEach(task => {
    const key = task.projectId || 'unassigned';
    overdueByProject[key] = (overdueByProject[key] || 0) + 1;
  });
  const topOverdue = Object.entries(overdueByProject).sort((a, b) => b[1] - a[1])[0];
  const topOverdueName = topOverdue ? (projectById(topOverdue[0])?.name || '未分组任务') : '';
  const avgDelay = pendingOverdue.length
    ? (pendingOverdue.reduce((sum, task) => sum + Math.max(0.1, (now - new Date(task.dueAt)) / 86400000), 0) / pendingOverdue.length).toFixed(1)
    : '0.0';

  return `
    <div class="stats-row">
      <div class="card stat-card">
        <div class="stat-top">
          <span class="stat-label">近 30 天完成</span>
          <span class="stat-ico" style="--sc:var(--accent);--sc-soft:var(--accent-soft)">${icon('check-circle')}</span>
        </div>
        <div class="stat-value">${stats.total}<small>项</small></div>
        <div class="stat-foot">
          <span class="trend-chip ${delta === null ? 'flat' : delta >= 0 ? 'up' : 'down'}">${icon('trend')}${delta === null ? '积累中' : `${delta >= 0 ? '+' : ''}${delta}%`}</span>
          <span>较前 7 天</span>
        </div>
      </div>
      <div class="card stat-card">
        <div class="stat-top">
          <span class="stat-label">按时交付率</span>
          <span class="stat-ico" style="--sc:var(--green);--sc-soft:var(--green-soft)">${icon('target')}</span>
        </div>
        <div class="stat-value">${rate}<small>%</small></div>
        <div class="stat-foot">
          <span class="trend-chip ${rate >= 90 ? 'up' : 'down'}">${icon('trend')}${rate >= 90 ? '+' : ''}${rate - 90}pp</span>
          <span>对照 90% 目标</span>
        </div>
      </div>
      <div class="card stat-card">
        <div class="stat-top">
          <span class="stat-label">累计深度工作</span>
          <span class="stat-ico" style="--sc:var(--violet);--sc-soft:var(--violet-soft)">${icon('zap')}</span>
        </div>
        <div class="stat-value">${focusHours.toFixed(1)}<small>小时</small></div>
        <div class="stat-foot"><span>日均 ${(focusHours / 30).toFixed(1)} 小时 · 沉浸时间</span></div>
      </div>
    </div>

    <section class="card chart-card">
      <div class="chart-head">
        <div>
          <div class="chart-title">效率趋势</div>
          <div class="chart-sub">过去 30 天每日完成的任务数量，悬停查看明细</div>
        </div>
        <span class="chart-badge"><i></i>近 30 天 · 共 ${stats.total} 项</span>
      </div>
      ${renderTrendChart(stats)}
    </section>

    <div class="insight-grid">
      <section class="card donut-card">
        <div class="chart-head" style="margin-bottom:2px">
          <div>
            <div class="chart-title">精力分配</div>
            <div class="chart-sub">近 30 天各项目完成的任务占比</div>
          </div>
          <span class="chart-badge"><i style="background:var(--violet)"></i>按项目</span>
        </div>
        ${renderDonut(stats)}
      </section>

      <section class="card ontime-card">
        <div class="chart-head" style="margin-bottom:2px">
          <div>
            <div class="chart-title">逾期率诊断</div>
            <div class="chart-sub">按时交付率与当前逾期风险</div>
          </div>
          <span class="chart-badge"><i style="background:var(--green)"></i>近 30 天</span>
        </div>
        <div class="ontime-body">
          <div class="gauge" style="--p:${rate}">
            <div class="gauge-inner">
              <strong>${rate}<span>%</span></strong>
              <small>按时交付率</small>
            </div>
          </div>
          <div class="ontime-stats">
            <div class="ontime-stat"><span>按时完成</span><strong>${stats.onTime} 项</strong></div>
            <div class="ontime-stat"><span>逾期完成</span><strong class="${stats.total - stats.onTime > 0 ? 'bad' : ''}">${Math.max(0, stats.total - stats.onTime)} 项</strong></div>
            <div class="ontime-stat"><span>当前待办逾期</span><strong class="${pendingOverdue.length ? 'bad' : ''}">${pendingOverdue.length} 项</strong></div>
            <div class="ontime-stat"><span>平均延期</span><strong>${avgDelay} 天</strong></div>
          </div>
        </div>
        <div class="insight-note">
          ${icon('alert')}
          <span>${pendingOverdue.length
            ? `当前有 <b>${pendingOverdue.length} 项</b>任务逾期${topOverdue ? `，主要集中在「<b>${escapeHTML(topOverdueName)}</b>」` : ''}。建议先清理延期最久的任务，再安排新工作。`
            : '本周期没有逾期任务，节奏保持得很好。可以继续保持「先排期、再执行」的习惯。'}</span>
        </div>
      </section>
    </div>`;
}

function renderAll(resetScroll = false) {
  const content = $('#content');
  const prevTop = content.scrollTop;
  const prevDayScroll = $('#day-scroll');
  const prevDayState = prevDayScroll ? { top: prevDayScroll.scrollTop, key: UI._lastDayKey } : null;

  renderSidebar();
  renderTopbar();
  $('#view').innerHTML = viewHTML();

  content.scrollTop = resetScroll ? 0 : prevTop;

  const dayKey = `${UI.scheduleView}:${UI.scheduleDate}`;
  const dayScroll = $('#day-scroll');
  if (dayScroll) {
    if (prevDayState && prevDayState.key === dayKey) {
      dayScroll.scrollTop = prevDayState.top;
    } else if (UI.scheduleDate === todayISO()) {
      const now = new Date();
      const minutes = now.getHours() * 60 + now.getMinutes();
      const top = (clamp(minutes, 480, 1200) - 480) / 60 * 64 - 130;
      dayScroll.scrollTop = clamp(top, 0, Math.max(0, dayScroll.scrollHeight - dayScroll.clientHeight));
    }
  }
  UI._lastDayKey = dayKey;
  afterRender();
}

function afterRender() {
  if (UI.activeTab === 'data') initChart();
  if (UI.activeTab === 'schedule') updateNowLine();
  if (UI.addingSubtask) {
    const { projectId, parentId } = UI.addingSubtask;
    const input = document.querySelector(`.sub-input[data-project="${projectId}"][data-parent="${parentId}"]`);
    if (input) input.focus();

/* =========================================================
   十八、Toast 与数据导出
   ========================================================= */
function toast(message, type = 'success') {
  const root = $('#toasts');
  if (!root) return;
  while (root.children.length >= 3) root.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  const ico = type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check';
  el.innerHTML = `<span class="toast-ico ${type}">${icon(ico)}</span><span class="toast-text">${escapeHTML(message)}</span>`;
  root.appendChild(el);
  const timer = setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 240);
  }, 3000);
  el.addEventListener('click', () => {
    clearTimeout(timer);
    el.remove();
  });
}

function downloadFile(filename, content, mime) {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (error) {
    toast('导出失败，请检查浏览器下载权限', 'error');
  }
}

function csvCell(value) {
  const text = String(value ?? '');
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function fmtDateTime(value) {
  if (!value) return '';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '';
  return `${dateISO(d)} ${hm(d)}`;
}

function exportJSON() {
  const payload = {
    app: 'Workbench · 个人工作台',
    version: S.version || 1,
    exportedAt: new Date().toISOString(),
    tasks: S.tasks,
    projects: S.projects,
    events: S.events,
    logs: S.logs,
    settings: S.settings,
    meta: S.meta
  };
  downloadFile(`workbench-backup-${todayISO()}.json`, JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
  toast('JSON 备份已导出');
}

let pendingImportState = null;

function prepareImportJSON(file) {
  if (!file) return;
  if (!Cloud.user) {
    toast('请先登录再导入数据', 'error');
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    toast('文件太大，请选择 8 MB 以内的 JSON 备份', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(String(reader.result || ''));
      const next = normalizeState(raw);
      if (!next) {
        toast('不是有效的工作台 JSON 备份', 'error');
        return;
      }
      pendingImportState = next;
      openConfirm({
        title: '导入并覆盖当前数据？',
        desc: '导入后当前账号的数据会被备份文件替换，并同步到其他设备。',
        message: `备份包含 <strong>${next.tasks.length} 项任务</strong>、<strong>${next.projects.length} 个项目</strong>、<strong>${next.events.length} 条日程</strong>。建议先导出当前数据作为备份。`,
        action: 'import-json-apply',
        confirmLabel: '导入并同步'
      });
    } catch (error) {
      toast('JSON 解析失败，请确认文件没有损坏', 'error');
    }
  };
  reader.onerror = () => toast('读取文件失败，请重试', 'error');
  reader.readAsText(file, 'utf-8');
}

function applyImportedState() {
  if (!pendingImportState) {
    closeModal();
    return;
  }
  S = pendingImportState;
  pendingImportState = null;
  UI.expanded.clear();
  UI.addingSubtask = null;
  UI.scheduleDate = todayISO();
  UI.scheduleView = 'day';
  UI.bellOpen = false;
  applyTheme();
  closeModal();
  persist();
  renderAll(true);
  toast('数据已导入，正在同步到云端');
}

function exportCSV() {
  const headers = ['任务 ID', '任务标题', '所属项目', '状态', '优先级', '截止时间', '创建时间', '完成时间', '预计耗时（分钟）', '已排期'];
  const rows = [...S.tasks]
    .sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt))
    .map(task => {
      const project = projectById(task.projectId);
      const scheduled = scheduledEventForTask(task.id);
      return [
        task.id,
        task.title,
        project ? project.name : '',
        task.status === 'completed' ? '已完成' : '待办',
        `${PRIORITIES[task.priority]?.label || '中'}优先级`,
        fmtDateTime(task.dueAt),
        fmtDateTime(task.createdAt),
        fmtDateTime(task.completedAt),
        task.estMinutes || '',
        scheduled ? `${scheduled.date} ${scheduled.start}-${scheduled.end}` : ''
      ];
    });
  const csv = '﻿' + [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
  downloadFile(`workbench-tasks-${todayISO()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('CSV 任务清单已导出');
}

/* =========================================================
   十九、任务、项目与日程操作
   ========================================================= */
function findNode(nodes, id) {
  for (const node of nodes || []) {
    if (node.id === id) return node;
    const found = findNode(node.children || [], id);
    if (found) return found;
  }
  return null;
}

function deleteNode(nodes, id) {
  if (!Array.isArray(nodes)) return false;
  for (let i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) {
      nodes.splice(i, 1);
      return true;
    }
    if (deleteNode(nodes[i].children || [], id)) return true;
  }
  return false;
}

function setNodeDone(node, done) {
  node.done = done;
  (node.children || []).forEach(child => setNodeDone(child, done));
}

function refreshParentStates(nodes) {
  (nodes || []).forEach(node => {
    if (node.children && node.children.length) {
      refreshParentStates(node.children);
      node.done = node.children.every(child => child.done);
    }
  });
}

function completeTask(id) {
  const task = taskById(id);
  if (!task || task.status !== 'pending') return;
  closeMenu();
  const row = document.querySelector(`[data-task-row="${id}"]`);
  if (row && row.classList.contains('completing')) return;
  const finalize = () => {
    if (task.status !== 'pending') return;
    const now = new Date();
    task.status = 'completed';
    task.completedAt = now.toISOString();
    adjustLog(dateISO(now), task.projectId, 1, now <= new Date(task.dueAt) ? 1 : 0, task.estMinutes || 30);
    persist();
    renderAll();
    toast('任务已完成，继续保持');
  };
  if (row) {
    row.classList.add('completing');
    setTimeout(finalize, 320);
  } else {
    finalize();
  }
}

function undoTask(id) {
  const task = taskById(id);
  if (!task || task.status !== 'completed') return;
  const completedAt = task.completedAt ? new Date(task.completedAt) : new Date();
  task.status = 'pending';
  task.completedAt = null;
  adjustLog(
    dateISO(completedAt),
    task.projectId,
    -1,
    completedAt <= new Date(task.dueAt) ? -1 : 0,
    -(task.estMinutes || 30)
  );
  persist();
  renderAll();
  toast('任务已恢复到待办', 'info');
}

function toggleSubtask(projectId, nodeId) {
  const project = projectById(projectId);
  if (!project) return;
  const node = findNode(project.subtasks, nodeId);
  if (!node) return;
  const beforeStatus = projectDisplayStatus(project);
  setNodeDone(node, !node.done);
  refreshParentStates(project.subtasks);
  updateProjectProgress(project);
  persist();
  renderAll();
  announceProjectStatusChange(beforeStatus, project);
}

function addSubtaskToTodo(projectId, nodeId) {
  const project = projectById(projectId);
  const node = project ? findNode(project.subtasks, nodeId) : null;
  if (!project || !node) return;
  const title = String(node.title || '').trim();
  if (!title) return;
  const existing = S.tasks.find(task =>
    task.status === 'pending' && task.projectId === project.id && task.title.trim() === title);
  if (existing) {
    toast('该子任务已在待办中', 'info');
    return;
  }
  const now = new Date();
  const due = new Date(now);
  due.setHours(18, 0, 0, 0);
  if (due <= now) due.setDate(due.getDate() + 1);
  S.tasks.push({
    id: uid('t'),
    title,
    projectId: project.id,
    priority: PRIORITIES[project.priority] ? project.priority : 'medium',
    status: 'pending',
    dueAt: due.toISOString(),
    createdAt: now.toISOString(),
    completedAt: null,
    estMinutes: 30
  });
  persist();
  renderAll();
  toast('已添加到待办');
}

function addSubtaskFromInput(input) {
  const title = input.value.trim();
  if (!title) {
    UI.addingSubtask = null;
    renderAll();
    return;
  }
  const project = projectById(input.dataset.project);
  if (!project) return;
  const beforeStatus = projectDisplayStatus(project);
  const parentId = input.dataset.parent;
  const parent = parentId ? findNode(project.subtasks, parentId) : null;
  if (parentId && !parent) return;
  const node = { id: uid('s'), title, done: false, children: [] };
  if (parent) {
    parent.children = parent.children || [];
    parent.children.push(node);
  } else {
    project.subtasks = project.subtasks || [];
    project.subtasks.push(node);
  }
  refreshParentStates(project.subtasks);
  updateProjectProgress(project);
  persist();
  renderAll();
  announceProjectStatusChange(beforeStatus, project);
}

function deleteSubtaskNow(projectId, nodeId) {
  const project = projectById(projectId);
  if (!project) return;
  const beforeStatus = projectDisplayStatus(project);
  if (!deleteNode(project.subtasks, nodeId)) return;
  refreshParentStates(project.subtasks);
  updateProjectProgress(project);
  persist();
  closeModal();
  renderAll();
  toast('子任务已删除', 'info');
  announceProjectStatusChange(beforeStatus, project);
}

function deleteTaskNow(id) {
  const task = taskById(id);
  if (!task) return;
  if (task.status === 'completed' && task.completedAt) {
    const completedAt = new Date(task.completedAt);
    adjustLog(
      dateISO(completedAt),
      task.projectId,
      -1,
      completedAt <= new Date(task.dueAt) ? -1 : 0,
      -(task.estMinutes || 30)
    );
  }
  S.events = S.events.filter(event => event.taskId !== id);
  S.tasks = S.tasks.filter(item => item.id !== id);
  closeModal();
  closeMenu();
  persist();
  renderAll();
  toast('任务已删除', 'info');
}

function deleteEventNow(id) {
  S.events = S.events.filter(event => event.id !== id);
  closeModal();
  persist();
  renderAll();
  toast('日程已删除，关联任务已回到待排期', 'info');
}

function deleteProjectNow(id) {
  const project = projectById(id);
  if (!project) return;
  const linkedTaskCount = S.tasks.filter(task => task.projectId === id).length;
  S.tasks.forEach(task => {
    if (task.projectId === id) task.projectId = '';
  });
  S.events.forEach(event => {
    if (event.projectId === id) event.projectId = '';
  });
  S.projects.forEach(other => {
    if (other.dependsOn === id) other.dependsOn = '';
  });
  S.projects = S.projects.filter(item => item.id !== id);
  UI.expanded.delete(id);
  if (UI.addingSubtask && UI.addingSubtask.projectId === id) UI.addingSubtask = null;
  closeModal();
  closeMenu();
  persist();
  renderAll();
  toast(`项目已删除${linkedTaskCount ? `，${linkedTaskCount} 项任务已转为未分组` : ''}`, 'info');
}

function clearAllNow() {
  const theme = S.settings.theme || 'system';
  S = createEmptyState(theme);
  UI.expanded.clear();
  UI.addingSubtask = null;
  UI.scheduleDate = todayISO();
  UI.scheduleView = 'day';
  UI.activeTab = 'overview';
  UI.focusAfterRender = null;
  UI.bellOpen = false;
  closeMenu();
  closeModal();
  applyTheme();
  persist();
  renderAll(true);
  toast('当前账号数据已清空，正在同步到云端', 'info');
}

function confirmGeneric() {
  const modal = UI.modal;
  if (!modal || modal.type !== 'confirm') return;
  const { action, payload = {} } = modal.data || {};
  if (action === 'delete-task') deleteTaskNow(payload.id);
  else if (action === 'delete-event') deleteEventNow(payload.id);
  else if (action === 'delete-subtask') deleteSubtaskNow(payload.projectId, payload.nodeId);
  else if (action === 'delete-project') deleteProjectNow(payload.id);
  else if (action === 'import-json-apply') applyImportedState();
  else closeModal();
}

function applyNoteFormat(format, projectId) {
  const project = projectById(projectId);
  const editor = document.querySelector(`.notes-editor[data-notes-project="${projectId}"]`);
  if (!project || !editor) return;
  editor.focus();
  try {
    document.execCommand(format, false, null);
  } catch (error) {
    // 旧浏览器不支持 execCommand 时静默降级
  }
  project.notes = sanitizeNotes(editor.innerHTML);
  persist();
}

function sanitizeNotes(html) {
  const template = document.createElement('template');
  template.innerHTML = String(html || '');
  template.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(node => node.remove());
  template.content.querySelectorAll('*').forEach(element => {
    Array.from(element.attributes).forEach(attr => {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on') || (name === 'href' && /^javascript:/i.test(attr.value))) {
        element.removeAttribute(attr.name);
      }
    });
  });
  return template.innerHTML;
}

function shiftSchedule(direction) {
  const d = fromISO(UI.scheduleDate);
  if (UI.scheduleView === 'day') d.setDate(d.getDate() + direction);
  else if (UI.scheduleView === 'week') d.setDate(d.getDate() + 7 * direction);
  else {
    d.setDate(1);
    d.setMonth(d.getMonth() + direction);
  }
  UI.scheduleDate = dateISO(d);
  renderAll(true);
}

function defaultEventTimes() {
  if (UI.scheduleDate !== todayISO()) return { start: '10:00', end: '11:00' };
  const now = new Date();
  let startMinutes = Math.ceil((now.getHours() * 60 + now.getMinutes() + 15) / 15) * 15;
  startMinutes = clamp(startMinutes, 480, 1140);
  return { start: fromMinutes(startMinutes), end: fromMinutes(Math.min(1200, startMinutes + 60)) };
}

function openNewEvent(date = UI.scheduleDate) {
  const times = date === todayISO() ? defaultEventTimes() : { start: '10:00', end: '11:00' };
  closeBell();
  openModal('event', {
    date,
    start: times.start,
    end: times.end,
    type: 'meeting',
    projectId: '',
    location: ''
  });
}

function openConfirm({ title, desc, message, action, payload, confirmLabel = '确认删除' }) {
  closeBell();
  openModal('confirm', { title, desc, message, action, payload, confirmLabel });
}

function openProjectAndExpand(projectId) {
  const project = projectById(projectId);
  if (!project) return;
  closeMenu();
  UI.activeTab = 'projects';
  if (projectIsComplete(project)) UI.completedGroupOpen = true;
  UI.expanded.add(projectId);
  renderAll(true);
  setTimeout(() => {
    const row = document.querySelector(`.prow[data-id="${projectId}"]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 60);
}

function handleAction(action, element) {
  const id = element.dataset.id;
  switch (action) {
    case 'toggle-sidebar':
      toggleSidebar();
      break;
    case 'complete-task':
      completeTask(id);
      break;
    case 'undo-task':
      undoTask(id);
      break;
    case 'task-menu':
      openTaskMenu(id, element);
      break;
    case 'project-menu':
      openProjectMenu(id, element);
      break;
    case 'edit-project': {
      const project = projectById(id);
      if (project) {
        closeMenu();
        closeBell();
        openModal('project', project);
      }
      break;
    }
    case 'delete-project': {
      const project = projectById(id);
      if (!project) break;
      const linkedTasks = S.tasks.filter(task => task.projectId === id).length;
      const linkedEvents = S.events.filter(event => event.projectId === id).length;
      closeMenu();
      openConfirm({
        title: '删除这个项目？',
        desc: '项目删除后无法恢复；关联任务会保留。',
        message: `即将删除「<strong>${escapeHTML(project.name)}</strong>」。项目内的子任务与备注会一并删除。${linkedTasks ? `项目下的 <strong>${linkedTasks} 项任务</strong>会保留并转为未分组；` : ''}${linkedEvents ? `相关 <strong>${linkedEvents} 条日程</strong>会解除项目关联。` : ''}`,
        action: 'delete-project',
        payload: { id: project.id }
      });
      break;
    }
    case 'edit-task': {
      const task = taskById(id);
      if (task) {
        closeMenu();
        closeBell();
        openModal('task', task);
      }
      break;
    }
    case 'delete-task': {
      const task = taskById(id);
      if (!task) break;
      closeMenu();
      openConfirm({
        title: '删除这项任务？',
        desc: '删除后不可撤销，相关日程也会一并移除。',
        message: `即将删除「<strong>${escapeHTML(task.title)}</strong>」。如果只是想暂时收起，可以先保留并调整截止时间。`,
        action: 'delete-task',
        payload: { id: task.id }
      });
      break;
    }
    case 'open-project':
      openProjectAndExpand(id);
      break;
    case 'toggle-project': {
      if (UI.expanded.has(id)) UI.expanded.delete(id);
      else UI.expanded.add(id);
      renderAll();
      break;
    }
    case 'toggle-completed-group':
      UI.completedGroupOpen = !UI.completedGroupOpen;
      renderAll();
      break;
    case 'new-project':
      closeBell();
      openModal('project', { status: element.dataset.status || 'ongoing' });
      break;
    case 'add-subtask': {
      const project = projectById(element.dataset.project);
      if (!project) break;
      UI.expanded.add(project.id);
      UI.addingSubtask = { projectId: project.id, parentId: element.dataset.parent || '' };
      renderAll();
      break;
    }
    case 'subtask-to-todo':
      addSubtaskToTodo(element.dataset.project, id);
      break;
    case 'delete-subtask': {
      const project = projectById(element.dataset.project);
      const node = project ? findNode(project.subtasks, id) : null;
      if (!project || !node) break;
      const childCount = countNodes(node.children || []);
      openConfirm({
        title: '删除这个子任务？',
        desc: '该节点及其全部下级任务会一起删除。',
        message: `「<strong>${escapeHTML(node.title)}</strong>」${childCount ? `包含 <strong>${childCount}</strong> 个下级任务，` : ''}删除后无法恢复。`,
        action: 'delete-subtask',
        payload: { projectId: project.id, nodeId: node.id }
      });
      break;
    }
    case 'toggle-subtask':
      toggleSubtask(element.dataset.project, id);
      break;
    case 'note-format':
      applyNoteFormat(element.dataset.format, element.dataset.project);
      break;
    case 'open-event': {
      const event = S.events.find(item => item.id === id);
      if (event) {
        closeBell();
        openModal('event', event);
      }
      break;
    }
    case 'new-event':
      openNewEvent();
      break;
    case 'new-event-date':
      openNewEvent(element.dataset.date || UI.scheduleDate);
      break;
    case 'delete-event': {
      const event = S.events.find(item => item.id === id);
      if (!event) break;
      openConfirm({
        title: '删除这条日程？',
        desc: '日程会从日历中移除，关联任务回到待排期列表。',
        message: `即将删除「<strong>${escapeHTML(event.title)}</strong>」 ${escapeHTML(event.date)} ${escapeHTML(event.start)}–${escapeHTML(event.end)}。`,
        action: 'delete-event',
        payload: { id: event.id }
      });
      break;
    }
    case 'cal-prev':
      shiftSchedule(-1);
      break;
    case 'cal-next':
      shiftSchedule(1);
      break;
    case 'cal-today':
      UI.scheduleDate = todayISO();
      renderAll(true);
      break;
    case 'pick-day':
      UI.scheduleDate = element.dataset.date || todayISO();
      UI.scheduleView = 'day';
      renderAll(true);
      break;
    case 'toggle-notifications':
      S.settings.notifications = !S.settings.notifications;
      persist();
      renderAll();
      break;
    case 'toggle-bell':
      closeMenu();
      UI.bellOpen = !UI.bellOpen;
      renderTopbar();
      break;
    case 'close-modal':
      closeModal();
      break;
    case 'clear-data':
      closeBell();
      openModal('clear', {});
      break;
    case 'confirm-clear':
      clearAllNow();
      break;
    case 'confirm-generic':
      confirmGeneric();
      break;
    case 'export-json':
      exportJSON();
      break;
    case 'export-csv':
      exportCSV();
      break;
    case 'sync-now':
      closeBell();
      syncNow();
      break;
    case 'logout':
      closeBell();
      closeMenu();
      logout();
      break;
    case 'import-json': {
      const input = $('#import-json-input');
      if (input) input.click();
      break;
    }
    default:
      break;
  }
}
